decision_labels:
  - {decision_label: "winner_scale", definition: "Clean stage hits minimum orders, ads/u cap, no contamination, projected monthly ROIC >=60%, and stock caps not stressed.", required_evidence: "full stage ledger, price/bid timestamps, delivery normal, stock draw", allowed_next_action: "increase BID same price or allocate larger stock cap", disallowed_next_action: "simultaneous price raise and BID raise", operator_warning: "scale exposure before price"}
  - {decision_label: "hold_more_data", definition: "Stage is directionally good but below minimum orders or clean days.", required_evidence: "daily views/clicks/orders, contamination clear", allowed_next_action: "extend same price/same bid 2-3 clean days", disallowed_next_action: "calling winner early", operator_warning: "do not overread tiny samples"}
  - {decision_label: "reduce_price", definition: "Visibility and clicks are present but conversion/orders are weak at current price.", required_evidence: "enough views/clicks, low orders, normal delivery", allowed_next_action: "reduce price one ladder step and hold or lower bid", disallowed_next_action: "raising BID to rescue overpriced listing", operator_warning: "protects false-negative risk"}
  - {decision_label: "increase_bid_same_price", definition: "Price signal is good or visibility is too low, and ads/u cap has room.", required_evidence: "low visibility or good conversion; bid timestamp", allowed_next_action: "+20 BID at same price", disallowed_next_action: "price raise at same time", operator_warning: "isolate BID effect"}
  - {decision_label: "raise_price_same_bid", definition: "Demand is clean, ads/u is below cap, ROIC is above target, and price has held.", required_evidence: "winner evidence plus bid unchanged proof", allowed_next_action: "+500 KZT same BID", disallowed_next_action: "BID increase same stage", operator_warning: "avoid whiplash"}
  - {decision_label: "inconclusive_visibility", definition: "Views/clicks are too low to judge product demand.", required_evidence: "low impressions/clicks report", allowed_next_action: "same-price low-BID visibility test", disallowed_next_action: "marking weak_concept", operator_warning: "no visibility means no market signal"}
  - {decision_label: "inconclusive_delivery_contaminated", definition: "Delivery promise or platform penalty affects the window.", required_evidence: "delivery promise evidence", allowed_next_action: "extend or restart clean window", disallowed_next_action: "using window for final failure", operator_warning: "contamination is not demand"}
  - {decision_label: "inconclusive_insufficient_orders", definition: "Clean days exist but orders are below threshold.", required_evidence: "orders below minimum", allowed_next_action: "extend same setup or keep passive", disallowed_next_action: "closing as failure", operator_warning: "low-data result is not proof"}
  - {decision_label: "weak_concept", definition: "Bundle failed at fair price with enough exposure, normal delivery, enough sizes, and acceptable economics.", required_evidence: "fair-price test, exposure, no contamination, min orders/days", allowed_next_action: "pause, creative review, passive only", disallowed_next_action: "scaling ads or PO", operator_warning: "only after fair signal price"}
  - {decision_label: "economically_unattractive", definition: "Fair market price cannot clear 50-60% projected monthly ROIC even with tight ads.", required_evidence: "economics model, price test, ads/u cap", allowed_next_action: "passive/fallback/liquidation only", disallowed_next_action: "active scale", operator_warning: "demand can exist but be low quality"}
  - {decision_label: "defer_stock_protection", definition: "Demand may be good but shared parent components or core sizes are at risk.", required_evidence: "stock draw by size, parent sales, component caps", allowed_next_action: "pause child, protect parent, wait for stock", disallowed_next_action: "increasing child caps", operator_warning: "stock protection beats growth excitement"}

