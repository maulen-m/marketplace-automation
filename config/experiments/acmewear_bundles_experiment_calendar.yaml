  - {field_name: "component_pool_decrement", required: true, source: "stock/component ledger", logged_by: "operator_or_script", when_to_log: "daily", why_it_matters: "tracks shorts/leggings/gift bag consumption"}
  - {field_name: "delivery_promise_status", required: true, source: "delivery promise watch or manual check", logged_by: "operator", when_to_log: "daily before interpreting", why_it_matters: "flags contaminated windows"}
  - {field_name: "views_by_day", required: true, source: "Kaspi card/campaign report", logged_by: "operator_or_script", when_to_log: "daily", why_it_matters: "distinguishes low visibility from failure"}
  - {field_name: "clicks_by_day", required: true, source: "Kaspi card/campaign report", logged_by: "operator_or_script", when_to_log: "daily", why_it_matters: "detects interest without orders"}
