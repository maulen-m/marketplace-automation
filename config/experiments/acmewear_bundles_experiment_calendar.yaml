  - {field_name: "bid_upload_timestamp", required: "true_if_ads_used", source: "Kaspi Marketing/card surface", logged_by: "operator_or_script", when_to_log: "at bid write", why_it_matters: "proves BID start"}
  - {field_name: "bid_verification_timestamp", required: "true_if_ads_used", source: "Kaspi Marketing/card surface", logged_by: "operator", when_to_log: "after bid visible", why_it_matters: "avoids mixed-stage data"}
