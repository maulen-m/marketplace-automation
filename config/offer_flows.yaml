  - flow_id: future-playwright-existing-card-upload
    title: Future Playwright Existing-Card Upload Fallback
    active: false
    goal: existing-card-onboarding
    artifact_state: reviewed-offer-upload-workbook
    owner_surface: Web_automation
    stores: [UNIVERSAL, STORE-B]
    write_surface: existing-card-ui
    priority: 80
    summary: >
      Placeholder fallback for cases where the everyday Chrome attach path is blocked and a fully
      Playwright-driven merchant login flow is safer or more durable for workbook-based onboarding.
      It inherits the exact-code, barcode-blank, publication-window, and fresh-readback rules from
      the existing-card UI upload spec.
    primary_entrypoint: python3 -m web_auto.kaspi_offer_ui_upload_playwright
    command_examples:
      - python3 -m web_auto.kaspi_offer_ui_upload_playwright --help
    dry_run_supported: true
    confirm_required: true
    verify_required: true
    repricer_followup: verify-import-and-dumping
    required_inputs: [store, workbook_path]
    preflight_checks:
      - Playwright merchant login path is confirmed for the store
      - Workbook dry-run validation is green
    success_checks:
      - Workbook rows are applied without relying on live everyday Chrome attach
      - Live verification is still performed after writes
    stoplines:
      - Merchant login selectors drift
      - Playwright path is less stable than the live Chrome attach path for this task
    fallback_flow_ids:
      - kaspi-existing-card-ui-upload
    docs_refs:
      - Docs/offer_ops/KASPI_EXISTING_CARD_UI_UPLOAD_SPEC.md
      - config/tasks/kaspi_existing_card_ui_upload_contract.yaml
      - Docs/sessions/2026-03-28_ACMEWEAR_Offer_Recovery_and_Chrome_Autoconnect_Report.md
    skill_refs:
